name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository framework and local documentation links
        run: python3 scripts/check_repository.py
      - name: Set up Node.js for frontend permission tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test RBAC0 frontend permission decisions
        run: node --test tests/frontend/rbac0-policy.test.cjs
      - name: Check whitespace in the commit
        run: git show --format= --check HEAD
