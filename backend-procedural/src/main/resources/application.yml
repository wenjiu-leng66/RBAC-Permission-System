# 通用运行配置。默认 h2 只用于本地检查；服务器需显式启用 mysql profile。
# HttpOnly/SameSite 管理会话 Cookie，HTTPS 部署时应设置 SESSION_COOKIE_SECURE=true。
spring:
  application:
    name: rbac-procedural-backend
  profiles:
    default: h2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
rbac:
  demo-enabled: ${RBAC_DEMO_ENABLED:false}
  initial-password: ${RBAC_INITIAL_PASSWORD:}
  allowed-origins: ${RBAC_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}


springdoc:
  swagger-ui:
    query-config-enabled: true

# 三层调用日志由 LayerLoggingAspect 统一输出，业务类不各自散落 log.*。
# 检查/演示时可保持 DEBUG；生产部署可用环境变量把某一层调到 INFO。
logging:
  level:
    com.municipal.rbac.procedural.controller: ${LOG_LEVEL_API:DEBUG}
    com.municipal.rbac.procedural.service: ${LOG_LEVEL_SERVICE:DEBUG}
    com.municipal.rbac.procedural.mapper: ${LOG_LEVEL_INFRASTRUCTURE:DEBUG}
    # 切面自身在 config 包；不打开这一行，成功/拒绝的 DEBUG 日志不会输出。
    com.municipal.rbac.procedural.config.LayerLoggingAspect: ${LOG_LEVEL_ASPECT:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{40} - %msg%n"
